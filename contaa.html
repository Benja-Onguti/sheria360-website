      /* Toast notification styles */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        max-width: 400px;
        width: 100%;
      }
      .toast {
        background: #fff;
        border-radius: 8px;
        padding: 20px 25px;
        margin-bottom: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        display: flex;
        align-items: center;
        gap: 15px;
        animation: slideInRight 0.5s ease;
        border-left: 4px solid #5b6dff;
      }
      .toast.success {
        border-left-color: #22c55e;
      }
      .toast.error {
        border-left-color: #ef4444;
      }

      }
      .toast-close {
        background: none;
        border: none;
        font-size: 20px;
        color: #94a3b8;
        cursor: pointer;
        padding: 0;
        line-height: 1;
        transition: color 0.3s;
      }
      .toast-close:hover {
        color: #1e293b;
      }

      @keyframes slideInRight {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

        content: "";

        height: 20px;
        top: 50%;
        left: 50%;

        margin-top: -10px;

        border-top-color: transparent;

    <!-- ====== N8N FORM INTEGRATION WITH DEBUGGING ====== -->
    <script>
      (function () {
        "use strict";

        // For local n8n:
        // const WEBHOOK_URL =
        //"https://ai.sheria360.com/webhook-test/sheria360-lead";

        // DEBUGGING SETUP
        // ============================================
        let debugEnabled = false;
        const debugPanel = document.getElementById("debugPanel");
        const debugLog = document.getElementById("debugLog");
        const debugToggle = document.getElementById("debugToggle");

        debugToggle.addEventListener("click", function () {
          debugEnabled = !debugEnabled;
          debugPanel.classList.toggle("show");
          debugToggle.textContent = debugEnabled ? "🔍 Hide Debug" : "🐛 Debug";
        });

        function logToDebug(message, type = "info") {
          const entry = document.createElement("div");
          entry.className = `log-entry ${type}`;
          const time = new Date().toLocaleTimeString();
          entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
          debugLog.appendChild(entry);
          debugLog.scrollTop = debugLog.scrollHeight;
          console.log(`[${type.toUpperCase()}]`, message);
        }

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const form = document.getElementById("contactForm");
        const submitBtn = document.getElementById("submitBtn");
        const toastContainer = document.getElementById("toastContainer");

        if (!form) {
          logToDebug("❌ Form not found! Check ID: contactForm", "error");
          return;
        }

        logToDebug("✅ Form found, initializing...", "success");

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(title, message, type = "success") {
          const toast = document.createElement("div");
          toast.className = `toast ${type}`;
          const icon = type === "success" ? "✅" : "❌";

          toast.innerHTML = `
                <div class="toast-icon ${type}">${icon}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;

          toastContainer.appendChild(toast);
          logToDebug(`${type.toUpperCase()}: ${title} - ${message}`, type);

          setTimeout(() => {
            if (toast.parentElement) {
              toast.style.opacity = "0";
              toast.style.transform = "translateX(100%)";
              toast.style.transition = "all 0.5s ease";
              setTimeout(() => toast.remove(), 500);
            }
          }, 6000);
        }

        // ============================================
        // LOADING STATE
        // ============================================
        function setLoading(isLoading) {
          if (isLoading) {
            submitBtn.classList.add("btn-loading");
            submitBtn.innerHTML = "Sending...";
            submitBtn.disabled = true;
            logToDebug("⏳ Submitting form...", "info");
          } else {
            submitBtn.classList.remove("btn-loading");
            submitBtn.innerHTML = "Send your Request";
            submitBtn.disabled = false;
          }
        }

        // ============================================
        // FIELD MAPPING
        // ============================================
        function mapFormData(formData) {
          const data = {
            name: formData.get("name") || "",
            email: formData.get("email") || "",
            phone: formData.get("phone") || "",
            organization: formData.get("organization") || "",
            organization_size: formData.get("organization_size") || "",
            company_type: formData.get("inquiry_type") || "",
            message: formData.get("message") || "",
          };

          logToDebug(
            `📝 Mapped data: ${JSON.stringify(data, null, 2)}`,
            "info",
          );
          return data;
        }

        // ============================================
        // SUBMIT TO N8N
        // ============================================
        async function submitToN8n(data) {
          logToDebug(`🚀 Sending to: ${WEBHOOK_URL}`, "info");
          logToDebug(`📦 Payload: ${JSON.stringify(data, null, 2)}`, "info");

          const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify(data),
          });

          logToDebug(
            `📡 Response status: ${response.status} ${response.statusText}`,
            "info",
          );

          if (!response.ok) {
            const errorText = await response.text();
            logToDebug(`❌ Error response: ${errorText}`, "error");
            throw new Error(
              `Server responded with ${response.status}: ${errorText}`,
            );
          }

          const result = await response.json();
          logToDebug(
            `✅ Success response: ${JSON.stringify(result, null, 2)}`,
            "success",
          );
          return result;
        }

        // ============================================
        // FORM SUBMISSION HANDLER
        // ============================================
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          logToDebug("🔄 Form submission triggered", "info");

          // 1. Collect and validate fields
          const name = document.getElementById("name")?.value?.trim() || "";
          const email = document.getElementById("email")?.value?.trim() || "";
          const phone = document.getElementById("phone")?.value?.trim() || "";
          const organization =
            document.getElementById("organization")?.value?.trim() || "";
          const organizationSize =
            document.getElementById("organization_size")?.value || "";
          const inquiryType =
            document.getElementById("inquiry_type")?.value || "";
          const message =
            document.getElementById("message")?.value?.trim() || "";

          logToDebug(
            `📋 Form values: Name=${name}, Email=${email}, Phone=${phone}, Org=${organization}`,
            "info",
          );

          // 2. Validation
          if (!name) {
            showToast(
              "Validation Error",
              "Please enter your full name.",
              "error",
            );
            return;
          }
          if (!email) {
            showToast(
              "Validation Error",
              "Please enter your email address.",
              "error",
            );
            return;
          }
          if (!phone) {
            showToast(
              "Validation Error",
              "Please enter your phone number.",
              "error",
            );
            return;
          }
          if (!organization) {
            showToast(
              "Validation Error",
              "Please enter your organization name.",
              "error",
            );
            return;
          }
          if (!organizationSize) {
            showToast(
              "Validation Error",
              "Please select your organization size.",
              "error",
            );
            return;
          }
          if (!inquiryType) {
            showToast(
              "Validation Error",
              "Please select your inquiry type.",
              "error",
            );
            return;
          }
          if (!message) {
            showToast(
              "Validation Error",
              "Please enter your message.",
              "error",
            );
            return;
          }

          // 3. Email validation
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            showToast(
              "Validation Error",
              "Please enter a valid email address.",
              "error",
            );
            return;
          }

          // 4. Phone validation
          const phoneRegex = /^[\+\d\s\-()]{10,}$/;
          if (!phoneRegex.test(phone)) {
            showToast(
              "Validation Error",
              "Please enter a valid phone number.",
              "error",
            );
            return;
          }

          logToDebug("✅ All validations passed", "success");

          // 5. Prepare data
          const formData = new FormData(form);
          const mappedData = mapFormData(formData);

          // 6. Submit
          setLoading(true);
          try {
            const result = await submitToN8n(mappedData);

            showToast(
              "🎉 Message Sent Successfully!",
              "Thank you for contacting Sheria360. Our team will get back to you within 24 hours.",
              "success",
            );

            form.reset();
            logToDebug("✅ Form reset successfully", "success");

            // Trigger Google Ads
            if (typeof gtag !== "undefined") {
              gtag("event", "conversion", {
                send_to: "AW-18205858668/0-p4CM2HvbccEOy2nelD",
                value: 1.0,
                currency: "USD",
              });
              logToDebug("📊 Google Ads conversion tracked", "info");
            }
          } catch (error) {
            logToDebug(`❌ Error: ${error.message}`, "error");

            let errorMessage =
              "Please try again or contact us directly at info@sheria360.com";
            if (
              error.message.includes("Failed to fetch") ||
              error.message.includes("NetworkError")
            ) {
              errorMessage =
                "Network error. Please check your internet connection and make sure n8n is running.";
            }
            if (error.message.includes("404")) {
              errorMessage =
                "Webhook not found. Please check the URL and make sure n8n is running.";
            }
            if (error.message.includes("500")) {
              errorMessage = "Server error. Please check n8n logs for details.";
            }

            showToast("❌ Submission Failed", errorMessage, "error");
          } finally {
            setLoading(false);
          }
        });

        // ============================================
        // TEST CONNECTION ON LOAD
        // ============================================
        async function testConnection() {
          try {
            logToDebug(`🔌 Testing connection to ${WEBHOOK_URL}...`, "info");
            const response = await fetch(WEBHOOK_URL, {
              method: "OPTIONS",
              headers: { "Content-Type": "application/json" },
            });
            logToDebug(`✅ Connection test: ${response.status}`, "success");
          } catch (error) {
            logToDebug(`⚠️ Connection test failed: ${error.message}`, "error");
            logToDebug(
              "💡 Make sure n8n is running and the webhook URL is correct",
              "error",
            );
          }
        }

        // Test on load
        setTimeout(testConnection, 1000);

        logToDebug("🚀 Sheria360 Contact Form initialized", "success");
        logToDebug(`🔗 Webhook URL: ${WEBHOOK_URL}`, "info");
        logToDebug("💡 Click the Debug button to see logs", "info");

        // ============================================
        // KEYBOARD SHORTCUT: Ctrl+Shift+D to toggle debug
        // ============================================
        document.addEventListener("keydown", function (e) {
          if (e.ctrlKey && e.shiftKey && e.key === "D") {
            e.preventDefault();
            debugToggle.click();
          }
        });

        console.log(
          "%c Sheria360 Contact Form ",
          "background: #1a237e; color: white; font-size: 16px; padding: 10px;",
        );
        console.log(`Webhook URL: ${WEBHOOK_URL}`);
        console.log("Press Ctrl+Shift+D to toggle debug panel");
      })();
    </script>
