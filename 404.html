<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found | Sheria360</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.png">
  <style>
    :root {
      --sheria-primary: #1a56db;
      --sheria-primary-dark: #1042b0;
      --sheria-navy: #0e2b5c;
      --sheria-navy-deep: #01103d;
      --sheria-slate: #334155;
      --sheria-slate-light: #64748b;
      --sheria-border: #e2e8f0;
      --sheria-bg: #f8fafc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--sheria-bg);
      color: var(--sheria-slate);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .error-container {
      max-width: 600px;
      background: #fff;
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid var(--sheria-border);
    }
    .logo {
      margin-bottom: 30px;
    }
    .logo img {
      max-height: 40px;
      width: auto;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--sheria-navy-deep);
      line-height: 1;
      margin-bottom: 10px;
    }
    .error-code span {
      color: var(--sheria-primary);
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--sheria-navy);
      margin-bottom: 15px;
    }
    p {
      color: var(--sheria-slate-light);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--sheria-primary);
      color: #fff;
      border: none;
    }
    .btn-primary:hover {
      background: var(--sheria-primary-dark);
    }
    .btn-outline {
      background: transparent;
      color: var(--sheria-primary);
      border: 1.5px solid var(--sheria-primary);
    }
    .btn-outline:hover {
      background: rgba(26, 86, 219, 0.05);
    }
    .home-link {
      margin-top: 25px;
      font-size: 0.85rem;
      color: var(--sheria-slate-light);
    }
    .home-link a {
      color: var(--sheria-primary);
      text-decoration: none;
      font-weight: 600;
    }
    .home-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="logo">
      <a href="index.html">
        <img src="assets/img/logo/logo-black.png" alt="Sheria360">
      </a>
    </div>
    <div class="error-code">4<span>0</span>4</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <div class="buttons">
      <a href="index.html" class="btn btn-primary">Back to Home</a>
      <a href="contact.html" class="btn btn-outline">Contact Support</a>
    </div>
    <div class="home-link">
      Or go to <a href="index.html">sheria360.com</a>
    </div>
  </div>
</body>
</html>
